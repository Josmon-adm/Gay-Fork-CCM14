- type: entity
  parent: WallXenoResin
  id: CCMWallXenoPathogen
  name: strange resin wall
  description: Weird strange white slime solidified into a thick wall.
  components:
  - type: Sprite
    sprite: _CCM14/Pathogen/xeno_wall.rsi
    state: resin
  - type: Icon
    sprite: _CCM14/Pathogen/xeno_wall.rsi
    state: resin
  - type: IconSmooth
    key: walls
    base: resin
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1350
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 338
  - type: XenoConstructionPlasmaCost
    plasma: 200
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: null
  - type: XenoNestSurface
    nest: CCMXenoNestPathogen

- type: entity
  parent: DoorXenoResin
  id: CCMDoorXenoPathogen
  name: strange resin door
  description: A strange white resin door, which is more durable.
  components:
  - type: Sprite
    sprite: _CCM14/Pathogen/xeno_door.rsi
    layers:
    - state: door_closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: closed_unlit
      map: ["enum.DoorVisualLayers.BaseUnlit"]
    - state: closed_unlit
      map: ["enum.DoorVisualLayers.BaseBolted"]
  - type: Door
    crushDamage:
      types:
        Blunt: 15
    openSpriteState: door_opened
    closedSpriteState: door_closed
    openingSpriteState: door_opening
    closingSpriteState: door_closing
    openSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move1.ogg
    closeSound:
      path: /Audio/_RMC14/Xeno/alien_resin_move2.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: MeleeReceivedMultiplier
    xenoDamage:
      types:
        Slash: 900
  - type: XenoConstructionPlasmaCost
    plasma: 200
    scalingCost: true
  - type: XenoStructureUpgradeable
    to: null

- type: entity
  id: CCMXenoWeedsWallPathogen
  name: strange weeds
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        density: 1000
        hard: false
  - type: Clickable
  - type: Sprite
    sprite: _CCM14/Pathogen/xeno_weed.rsi
    drawdepth: Objects
#    layers:
#    - state: weedwall
  - type: IconSmooth
    key: cm_xeno_weeds_walls
    base: weedwall
    mode: Corners
  - type: XenoNestSurface
  - type: XenoFriendly
  - type: Damageable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ImmuneToUnarmed
  - type: WallMount
    arc: 360
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2
  - type: XenoChargeDontHit

