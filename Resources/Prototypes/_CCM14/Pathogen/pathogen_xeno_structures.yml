# Hive Structures

- type: entity
  parent: HiveCoreXeno
  id: CCMHiveCoreXenoPathogen
  name: blight core
  description: A giant pulsating white mound of mass. It looks very much alive.
  components:
  - type: Sprite
    sprite: _CCM14/Pathogen/hive_structures.rsi
    layers:
     - sprite: _CCM14/Pathogen/Structures/Xenos/xeno_weed.rsi
       state: hive_weed0
     - state: blight_core
  - type: XenoWeeds
    range: 7
    spawns: CCMXenoHiveWeedsCorePathogen
    level: 3
    blockOtherWeeds: true
    spreadsOnSemiWeedable: true
  - type: GhostRole
    name: Popper
    description: Pop it
    raffle:
      settings: short
  - type: GhostRoleMobSpawner
    availableTakeovers: 2
    deleteOnSpawn: false
    prototype: CCMXenoPathogenPopper
  - type: ManageHive
  - type: HiveLeaderGranter
  - type: XenoEvolutionGranter
  - type: XenoOvipositorCapable
  - type: XenoWordQueen
  - type: XenoPsychicCommunication
  - type: InnateCommandSpeech
  - type: RMCInnateRadioTextIncrease
    radioTextIncrease: 3
    instrinsic: true
  - type: CommendationGiver
  - type: XenoOmitNumber
  - type: QueenEyeAction
  - type: RMCTrackable
  - type: TimedSpawner
    intervalSeconds: 10
    prototypes:
    - CCMXenoHiveEggPathogen
    maximumEntitiesSpawned: 3

- type: entity
  id: CCMHiveCoreXenoPathogenConstructionNode
  parent: HiveCoreXenoConstructionNode
  name: blight core
  description: A giant pulsating white mound of mass. It looks very much alive. Looks like a marker for something.
  suffix: Construction
  components:
  - type: Sprite
    color: '#FFFFFFAA'
    sprite: _CCM14/Pathogen/hive_structures.rsi
    layers:
    - state: blight_core
    - sprite: _RMC14/Interface/xeno_hud.rsi
      state: xeno_structure_node_indicator
      scale: 0.8, 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300 # TODO RMC14
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: HiveConstructionNode
    initialPlasmaCost: 400
    plasmaCost: 1000
    spawn: CCMHiveCoreXenoPathogen

# Hive egg

- type: entity
  parent: XenoFruitLesser
  id: CCMXenoHiveEggPathogen #This shi is not egg, thats uhh fruit
  name: strange white egg
  components:
  - type: Sprite
    sprite: _CCM14/Pathogen/egg.rsi
    drawdepth: SmallMobs
    layers:
    - state: egg_item
      map: [ "enum.XenoFruitLayers.Base" ]
  - type: XenoFruit
    itemState: egg_item
    growingState: egg
    grownState: egg_spraying
    eatenState: egg_opened
    growTime: 30
    popup: rmc-xeno-fruit-effect-greater
    canConsumeAtFull: false
    color: "#17991B"
  - type: XenoFruitHeal
    healAmount: 75
  - type: XenoFruitRegen
    tickCount: 15     # 75 health over 15 seconds
    tickPeriod: 1
    regenPerTick: 5
  - type: XenoFruitShield
    duration: 60
    shieldAmount: 200
    shieldDecay: 10
    shieldRatio: 0.3
  - type: XenoFruitSpeed
    speedModifier: 0.2
  - type: XenoFruitPlasma
    tickCount: 5      # 240 plasma over 15 seconds
    tickPeriod: 3
    regenPerTick: 48