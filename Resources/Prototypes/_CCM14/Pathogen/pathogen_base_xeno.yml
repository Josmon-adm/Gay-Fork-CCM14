- type: entity
  abstract: true
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  - RMCXenoCommendationReceiver
  - RMCXenoVentCrawler
  id: CCMXenoPathogenBase
  name: Pathogen Creature
  description: A creature of the Mycelial Confluence.
  components:
  - type: Language
    spokenLanguages:
    - Pathogen
    understoodLanguages:
    - Pathogen
    currentLanguage: Pathogen
    defaultLanguage: Pathogen
  # No acid blood
  - type: AcidBloodSplash
    closeSplashRadius: 1
    standardSplashRadius: 1
    gibSplashRadius: 1
    splashCooldown: 9999999
    damage:
      types:
        Heat: 0
  # Pathogen weeds are their terrain, they still need weeds to regen
  # Individual castes override plasmaRegenOnWeeds as needed
  - type: XenoPlasma
    plasma: 0
    maxPlasma: 0
    plasmaRegenOnWeeds: 0
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Hivemind
    - MyceliumLink
  - type: UserInterface
    interfaces:
      enum.CMSurgeryUIKey.Key:
        type: CMSurgeryBui
      enum.XenoEvolutionUIKey.Key:
        type: XenoEvolutionBui
      enum.XenoDevolveUIKey.Key:
        type: XenoDevolveBui
      enum.XenoWatchUIKey.Key:
        type: XenoWatchBui
      enum.XenoChooseStructureUI.Key:
        type: XenoChooseStructureBui
      enum.XenoPheromonesUI.Key:
        type: XenoPheromonesBui
      enum.XenoOrderConstructionUI.Key:
        type: XenoOrderConstructionBui
      enum.XenoFruitChooseUI.Key:
        type: XenoFruitChooseBui
      enum.XenoWordQueenUI.Key:
        type: XenoWordQueenBui
      enum.HiveTeamUIKey.Key:
        type: HiveTeamBui
      enum.HiveLeaderSquadUIKey.Key:
        type: HiveLeaderSquadBui
      enum.TacticalMapUserUi.Key:
        type: TacticalMapUserBui
      enum.XenoReserveParasiteChangeUI.Key:
        type: ReserveParasitesBoundUserInterface
      enum.XenoParasiteGhostUI.Key:
        type: XenoParasiteGhostBui
        requireInputValidation: false
      enum.DialogUiKey.Key:
        type: DialogBui
  - type: ActiveRadio
    channels:
    - Hivemind
    - MyceliumLink
    receiveAllChannels: false
  - type: SoundOnDeath
    sound:
      collection: PathogenDeath
      params:
        volume: -4
  - type: XenoHidden
  - type: Speech
    speechSounds: Pathogen
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenBloodburster
    - CCMDecalGibPathogenSmallCorpse

- type: entity
  abstract: true
  parent:
  - CCMXenoPathogenBase
  - RMCXenoMobCollision
  id: CCMXenoPathogenMatureBase
  components:
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenNeomorph
    - CCMDecalGibPathogenBigCorpse

- type: decal
  id: CCMDecalGibPathogenBigCorpse
  parent: RMCDecalBloodBase
  sprite:
    sprite: _CMU14/Mobs/Xenonids/Pathogen/neomorph.rsi
    state: neomorph_corpse

- type: decal
  id: CCMDecalGibPathogenSmallCorpse
  parent: RMCDecalBloodBase
  sprite:
    sprite: _CMU14/Mobs/Xenonids/Pathogen/aberration_bloodburster.rsi
    state: aberration_bloodburster_corpse