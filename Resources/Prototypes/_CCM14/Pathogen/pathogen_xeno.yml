# Neomorph

- type: entity
  parent: 
  - CCMXenoPathogenMatureBase
  id: CCMXenoPathogenNeomorph
  name: Neomorph
  description: A strange white alien drone...
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleDrone
  - type: Sprite
    sprite: _CMU14/Mobs/Xenonids/Pathogen/neomorph.rsi
  - type: Xeno
    actionIds:
    - CCMActionXenoRestPahtogen
    - CCMActionXenoWatchPathogen
    - CCMActionXenoHidePathogen
    - CCMActionXenoTailStabPathogen
    - CCMActionXenoRegurgitatePathogen
    - CCMActionXenoPheromonesPathogen
    - CCMActionXenoPathogenPlantWeeds
    - CCMActionXenoPathogenChooseStructure
    - CCMActionXenoPathogenOrderConstruction
    - CCMActionXenoPathogenSecreteStructure
    role: CCMXenoPathogenNeomorph
    hudOffset: -0.1,0.15
    tier: 1
    bypassTierCount: true
    unlockAt: 0 # 1 minute
  - type: XenoAcid
