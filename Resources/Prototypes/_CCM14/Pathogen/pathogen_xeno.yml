    - hands: 2
      whitelist:
        components:
        - XenoEgg
  - type: XenoEvolution
    canEvolveWithoutGranter: true
    max: 200
    evolvesTo:
    - CMXenoCarrier
    - CMXenoBurrower
    - CMXenoHivelord
    earlyEvolvesTo:
    - CMXenoLurker
    - CMXenoSpitter
    - CMXenoWarrior
  - type: Evasion
    evasion: 15
  - type: IntelRecoverCorpseObjectiveOnDeath
    value: 0.1
  - type: FixedIdentity
    name: ccm-job-name-xeno-pathogen-neomorph
  - type: RMCActionOrder
    id: CCMXenoPathogenNeomorph
  - type: RMCSurgeryXenoHeart
    item: RMCOrganXenoHeartT1
  - type: RMCXenoDamageVisuals
    prefix: neomorph

