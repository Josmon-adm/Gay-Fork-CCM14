# Popper

- type: entity
  id: CCMActionXenoPathogenBoomLeap
  parent: ActionXenoLeap
  name: KAMIKAZE
  description: Jump towards a given location and blow up yourself if hitted an enemy.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: prae_acid_ball
    useDelay: 10

