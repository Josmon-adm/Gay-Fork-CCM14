- type: entity
  id: CCMActionXenoPathogenPlantWeeds
  parent: ActionXenoBase
  name: Plant Weeds (75)
  description: Plant a weed node that will spread more weeds.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: plant_weeds
    useDelay: 1
  - type: InstantAction
    event: !type:XenoPlantWeedsActionEvent
      prototype: CCMXenoWeedsSourcePathogen
  - type: SwappableAction
    swappedEventTemplate: !type:XenoExpandWeedsActionEvent
    originalEventTemplate: !type:XenoPlantWeedsActionEvent

- type: entity
  id: CCMActionXenoPathogenChooseStructure
  parent: ActionXenoBase
  name: Choose Resin Structure
  description: "Choose a structure to secrete with the 'Secrete Resin' action."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: TEMPLATE  # no place_resin in pathogen RSI
  - type: InstantAction
    event: !type:XenoChooseStructureActionEvent
  - type: XenoChooseConstructionAction
  - type: RMCDazeableAction

- type: entity
  id: CCMActionXenoPathogenSecreteStructure
  parent: ActionXenoBase
  name: Secrete Resin
  description: "Builds the structure chosen with the 'Choose Resin Structure' action."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: secrete_resin
  - type: TargetAction
    deselectOnMiss: false
    range: 0
    repeat: true
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoSecreteStructureActionEvent
  - type: XenoConstructionAction
    checkStructureSelected: true
    checkWeeds: true
    canUpgrade: true
  - type: RMCDazeableAction

- type: entity
  id: CCMActionXenoPathogenOrderConstruction
  parent: ActionXenoBase
  name: Order Construction
  description: Starts construction of an important hive structure.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: morph_resin
  - type: InstantAction
    event: !type:XenoOrderConstructionActionEvent
  - type: RMCDazeableAction

- type: entity
  id: CCMActionXenoPathogenResinHole
  parent: ActionXenoBase
  name: Plant Resin Hole (200)
  description: Places a resin hole on weeds. It can be filled with boiler gas, acid, or parasites.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/actions_pathogen.rsi
      state: place_trap
    useDelay: 1
  - type: InstantAction
    event: !type:XenoPlaceResinHoleActionEvent
  - type: RMCDazeableAction

