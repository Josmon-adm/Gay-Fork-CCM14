    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/shotgun_projectiles.rsi
    layers:
    - state: beanbag
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 160
        Heat: 150
        # 10 brute damage + 150 brute and 150 burn to simulate direct explosive damage.
        # Temporary mechanic to make it consistent with intended main target damage.
    maxFixedRange: 1 # 6 tiles
  - type: CMArmorPiercing
    amount: 20
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 10
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 1
  - type: ProjectileMaxRange
    max: 1
  - type: Explosive
    # TODO RMC14 Very inconsistent because explosions spawn at epicenter of the rocket, not the hit entity. Proper values are around (50, 40, 90)
    explosionType: RMC
    maxIntensity: 20
    intensitySlope: 8
    totalIntensity: 150
    maxTileBreak: 0
  - type: TriggerOnCollide
  - type: ExplodeOnTrigger

