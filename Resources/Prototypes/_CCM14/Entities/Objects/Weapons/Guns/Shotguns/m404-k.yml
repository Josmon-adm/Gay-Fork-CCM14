      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 60
  - type: CMArmorPiercing
    amount: 20
  - type: ProjectileSpread
    proto: CCMPelletM404KShock
    count: 2
    spread: 4
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 7
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 1
  - type: RMCProjectileAccuracy
