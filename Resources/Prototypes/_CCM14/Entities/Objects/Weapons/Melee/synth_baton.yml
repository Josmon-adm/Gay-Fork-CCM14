- type: entity
  parent: RMCStunBatonDamaged
  id: CCMSynthBaton
  name: магнитно-электростатическая дубинка синтетика 
  suffix: CCM
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Weapons/Melee/synth_baton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _CCM14/Objects/Weapons/Melee/synth_baton.rsi
    slots:
    - Belt
    - Suitstorage
  - type: Stunbaton
    energyPerUse: 50
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/egloves.ogg
      params:
        variation: 0.2
    activatedDamage:
      types:
        Heat: 10
  - type: ItemToggleSize
    activatedSize: Huge
  - type: LandAtCursor # it deals stamina damage when thrown
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: UseDelay
  - type: MeleeDamageMultiplier
    multiplier: 5
    whitelist:
      components:
      - Xeno
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: WhitelistPickupBy
    whitelist:
      components:
        - Synth
  - type: ComponentToggler
    components:
    - type: MCXenoPlasmaDamageOnHit
      multiplier: 0.5
      missingMultiplier: 1
    - type: RMCStaminaDamageOnHit
      damage: 100
      jitterDuration: 2
    - type: PointLight
      enabled: false
      radius: 2
      energy: 2
      color: orange
      netsync: false
    - type: RMCStaminaDamageOnCollide
      damage: 35
    - type: XenoMeleeSlow
      slowTime: 10
      higherOnXenos: True
    - type: StunOnHit
      duration: 4
      whitelist:
        components:
        - XenoLight