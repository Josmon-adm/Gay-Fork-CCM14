- type: entity
  parent: [RMCPouchOpenClosed, RMCPouchStorage]
  id: RMCPouchMedical
  name: medical pouch
  description: It can carry small medical supplies.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Pouches/medical.rsi
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,11,1 #6 (4) slots | CCM-CMU Added +2 slots
    whitelist:
      tags:
      - DiscreteHealthAnalyzer
      - Dropper
      - Pill
      - Bottle
      - Syringe
      - PillCanister
      - CMTraumaKit
      - CMBurnKit
      - CMOintment
      - Brutepack
      - CMBloodPack
      - CMUMedicalSplint # CCM\CMU Splint Tag
      - RMCPenlight
      - CMAutoInjector
      - CMFireExtinguisherPortable
      - RMCSyringeCase
      - CMSurgicalLine
      - CMSynthGraft
      - PillPacket
      - Hypospray
      components:
      - Hypospray
  - type: FixedItemSizeStorage

- type: entity
  parent: RMCPouchMedical
  id: RMCPouchMedicalFill
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMHealthAnalyzer
    - id: CMUSplintItem # CMU ADD
    - id: CMBurnKit10
    - id: CMTraumaKit10
    - id: CCMTramadolAutoInjector # CCM-CMU ADD
    - id: CMTricordrazineAutoInjector # CCM-CMU ADD

- type: entity
  parent: RMCPouchMedical
  id: RMCPouchMedicalPills
  suffix: Pills
  components:
  - type: StorageFill
    contents:
    - id: CCMPillCanisterTramadol #CMU-CCM ADD
    - id: CMPillCanisterBicaridine
    - id: CMPillCanisterKelotane
    - id: CMPillCanisterDexalin
    - id: CMPillCanisterDylovene #CMU-CCM ADD
    - id: CMPillCanisterTricordrazine #CMU-CCM ADD

- type: entity
  parent: RMCPouchMedical
  id: RMCPouchMedicalERT
  suffix: ERT
  components:
  - type: StorageFill
    contents:
    - id: CMSurgicalLine
    - id: CMSynthGraft
    - id: CMHealthAnalyzer
    - id: CMHyposprayFilledTricord
    - id: CCMPillCanisterTramadol #CMU-CCM ADD
    - id: CMPillCanisterTricordrazine #CMU-CCM ADD

- type: entity
  parent: RMCPouchMedical
  id: RMCPouchMedicalSPPSynth
  suffix: ERT
  components:
  - type: StorageFill
    contents:
    - id: CMSurgicalLine
    - id: CMSynthGraft
    - id: RMCHyposprayFilledEpi
    - id: RMCBottleEpinephrine
    - id: CCMPillCanisterTramadol #CMU-CCM ADD
    - id: CMPillCanisterTricordrazine #CMU-CCM ADD
    
